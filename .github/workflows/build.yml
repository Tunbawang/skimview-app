name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -o skimview-src.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Show version being built (sanity check)
        run: grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK (auto-signed, installable as-is)
        run: ./gradlew clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skimview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
